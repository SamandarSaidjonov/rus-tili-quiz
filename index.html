<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Рус тили сўз квизи</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Sans+Narrow:wght@700&family=PT+Sans:wght@400;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: a tear-off calendar pad. Each lesson is a pad on the home page; inside a lesson,
     one page per question, torn away on "Кейинги". Russian is set in a serif, Uzbek in a sans, like the workbook. */
  --bg:#e4e7eb;
  --paper:#fbfbfa;
  --ink:#1b1d21;
  --muted:#656b75;
  --rule:#d4d8de;
  --accent:#c8102e;
  --good:#1b7a45;
  --good-bg:#e2f2e8;
  --bad-bg:#fbe6e9;
  --f-display:"PT Sans Narrow","Arial Narrow","Roboto Condensed",sans-serif;
  --f-ru:"PT Serif",Georgia,"Times New Roman",serif;
  --f-uz:"PT Sans","Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121418;--paper:#1d2026;--ink:#ecebe8;--muted:#9ba1aa;--rule:#343840;
    --accent:#ff5c6c;--good:#5cc98d;--good-bg:#173020;--bad-bg:#3a1a20;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121418;--paper:#1d2026;--ink:#ecebe8;--muted:#9ba1aa;--rule:#343840;
  --accent:#ff5c6c;--good:#5cc98d;--good-bg:#173020;--bad-bg:#3a1a20;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-uz);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 56px;display:flex;flex-direction:column;gap:14px}
#lesson{display:flex;flex-direction:column;gap:14px}

/* header */
.top{display:flex;flex-direction:column;gap:2px}
.crumb{align-self:flex-start;margin-bottom:8px;font-size:15px;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--rule);padding:2px 0}
.crumb:hover{border-color:var(--ink)}
.kicker{font-family:var(--f-display);color:var(--accent);text-transform:uppercase;letter-spacing:.08em;font-size:15px}
.top h1{font-family:var(--f-display);font-size:38px;line-height:1;text-transform:uppercase;letter-spacing:.01em;margin:0;text-wrap:balance}
.top p{margin:4px 0 0;color:var(--muted);font-size:14px}
@media (hover:none){.kbd{display:none}}

/* lesson picker */
.lessons{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:24px}
.lesson-card{display:block;text-decoration:none;color:inherit;border-radius:4px}
.lesson-card .page{transition:transform .15s ease}
.lesson-card:hover .page{transform:translateY(-2px)}
.ltitle{margin:0;font-family:var(--f-display);font-size:30px;line-height:1.05;text-transform:uppercase;text-wrap:balance}
.lsub{color:var(--muted);font-size:15px;margin-top:-8px}
.status{font-size:15px;font-variant-numeric:tabular-nums}
.go{font-weight:700;color:var(--accent)}

/* settings + word list */
details.panel{background:var(--paper);border:1px solid var(--rule);border-radius:8px}
details.panel>summary{cursor:pointer;padding:11px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px;list-style:none;font-weight:700;font-size:15px}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary .cur{font-weight:400;font-size:14px;color:var(--muted);text-align:right;margin-left:auto}
details.panel>summary::after{content:"+";font-family:var(--f-display);font-size:20px;line-height:1;color:var(--muted)}
details.panel[open]>summary::after{content:"−"}
.panel-body{padding:2px 14px 14px;display:flex;flex-direction:column;gap:12px}
.group{display:flex;flex-direction:column;gap:6px}
.lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--rule);background:transparent;color:var(--ink);border-radius:999px;padding:6px 13px;font:inherit;font-size:15px;cursor:pointer}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* progress */
.progress{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.progress .pos{min-width:4.5em}
.bar{flex:1;height:4px;background:var(--rule);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);transition:width .3s ease}
.tally{display:flex;gap:10px}
.tally .ok{color:var(--good)}
.tally .no{color:var(--accent)}

/* the pad */
.pad{position:relative;isolation:isolate;margin-bottom:10px}
.pad::before,.pad::after{content:"";position:absolute;background:var(--paper);border:1px solid var(--rule);border-radius:4px}
.pad::before{top:5px;left:5px;right:5px;bottom:-5px;z-index:-1}
.pad::after{top:10px;left:10px;right:10px;bottom:-10px;z-index:-2}
.page{position:relative;z-index:1;background:var(--paper);border:1px solid var(--rule);border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.07);transform-origin:12% 0}
.binding{height:14px;background:var(--ink);border-radius:3px 3px 0 0;display:flex;justify-content:center;align-items:center;gap:64px}
.binding span{width:8px;height:8px;border-radius:50%;background:var(--bg)}
.head{display:grid;grid-template-columns:auto 1fr;align-items:end;gap:14px;padding:12px 18px 10px;border-bottom:2px dashed var(--rule)}
.num{font-family:var(--f-display);font-size:78px;line-height:.82;color:var(--accent);font-variant-numeric:tabular-nums}
.page.review .num{color:var(--muted)}
.meta{display:flex;flex-direction:column;gap:1px;padding-bottom:3px;min-width:0}
.meta .topic{font-family:var(--f-display);font-size:22px;line-height:1.1;text-transform:uppercase;letter-spacing:.04em}
.meta .of{font-size:13px;color:var(--muted)}
.body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:14px}
.ask{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.prompt{display:flex;align-items:flex-start;gap:12px;margin-top:-8px}
.word{margin:0;font-size:32px;line-height:1.2;font-weight:700;text-wrap:balance;flex:1;min-width:0}
.word.ru{font-family:var(--f-ru)}
.word.uz{font-family:var(--f-uz)}
.say{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--rule);background:transparent;color:var(--ink);display:inline-grid;place-items:center;cursor:pointer;padding:0}
.say:hover{border-color:var(--ink)}
.pair .say{width:32px;height:32px;vertical-align:middle;margin-left:8px}
.pair .say svg{width:16px;height:16px}

/* options */
.opts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.opt{width:100%;min-height:52px;display:grid;grid-template-columns:1.3em 1fr 1.2em;align-items:center;gap:10px;text-align:left;padding:11px 14px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink);font-size:18px;line-height:1.3;cursor:pointer}
.opt .k{font-family:var(--f-display);color:var(--muted);font-size:18px}
.opt .mark{font-weight:700;text-align:right}
.opt.ru .t{font-family:var(--f-ru)}
.opt.uz .t{font-family:var(--f-uz)}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt[disabled]{cursor:default}
.opt.right{background:var(--good-bg);border-color:var(--good)}
.opt.right .mark,.opt.right .k{color:var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--accent)}
.opt.wrong .t{text-decoration:line-through;text-decoration-thickness:2px}
.opt.wrong .mark,.opt.wrong .k{color:var(--accent)}
.opt.dim{opacity:.5}

/* feedback + navigation */
.fb{border-top:1px solid var(--rule);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.verdict{font-family:var(--f-display);font-size:24px;line-height:1;text-transform:uppercase;letter-spacing:.03em}
.verdict.small{font-size:18px}
.verdict.ok{color:var(--good)}
.verdict.no{color:var(--accent)}
.pair{font-size:17px}
.pair .ru{font-family:var(--f-ru);font-weight:700}
.ex{color:var(--muted);font-size:15px}
.ex i{font-family:var(--f-ru);font-size:16px}
.ctx{margin:-6px 0 0;font-size:16px;color:var(--muted)}
.example,.explain{display:flex;flex-direction:column;gap:3px;margin-top:4px}
.example p,.explain p{margin:0}
.ex-ru{font-family:var(--f-ru);font-size:18px;line-height:1.4}
.ex-ru b{color:var(--accent)}
.ex-ru .say{width:30px;height:30px;vertical-align:middle;margin-left:8px}
.ex-ru .say svg{width:15px;height:15px}
.ex-uz{color:var(--muted);font-size:15px}
.explain{border-left:3px solid var(--rule);padding-left:10px}
.explain p{font-size:15px;max-width:60ch}
.lex{font-family:var(--f-ru);font-size:14px;margin-top:4px}
.lex b{color:var(--accent);font-weight:700}
.lex-uz{font-size:13px;color:var(--muted)}
.nav{display:flex;align-items:center;gap:8px}
.nav .sp{flex:1}
.linkbtn{align-self:flex-end;font:inherit;font-size:14px;background:none;border:0;padding:2px 0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.linkbtn:hover{color:var(--ink)}

.btn{font:inherit;font-weight:700;font-size:16px;border-radius:8px;padding:11px 18px;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--paper)}
.btn.ghost{background:transparent;color:var(--ink)}
a.btn{display:inline-block;text-decoration:none}
.actions{display:flex;flex-wrap:wrap;gap:8px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* results + word list */
.msg{margin:0;font-size:17px;max-width:60ch}
.sub{margin:6px 0 0;font-family:var(--f-display);font-size:18px;text-transform:uppercase;letter-spacing:.05em}
.tblwrap{overflow-x:auto}
table.book{width:100%;border-collapse:collapse;font-size:16px}
.book th{background:var(--rule);font-family:var(--f-display);font-size:14px;text-transform:uppercase;letter-spacing:.07em;text-align:left;padding:6px 10px;border:1px solid var(--rule)}
.book td{border:1px solid var(--rule);padding:6px 10px;vertical-align:top}
.book td.ru{font-family:var(--f-ru);width:50%}
.panel-body .sub:first-child{margin-top:0}
.note{margin:0;font-size:14px;color:var(--muted)}

/* motion */
.page.enter{animation:enter .22s ease-out}
.page.tear{animation:tear .36s ease-in forwards}
@keyframes enter{from{opacity:.35}to{opacity:1}}
@keyframes tear{to{transform:translateY(-28px) rotate(-7deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.page.enter,.page.tear{animation:none}.bar i,.lesson-card .page{transition:none}}

@media (max-width:400px){
  .top h1{font-size:32px}
  .num{font-size:64px}
  .word{font-size:28px}
  .opt{font-size:17px}
  .ltitle{font-size:26px}
}
</style>
</head>

</div>

["f01","f","learn","Чита'ть / прочита'ть","Ўқимоқ","Я *чита'ю* книгу каждый вечер. Вчера я *прочита'л* её до конца.","Мен ҳар оқшом китоб ўқийман. Кеча уни охиригача ўқиб бўлдим.","чита'ть — жараён ёки такрорланадиган иш (несовершенный вид). прочита'ть — иш тугади, натижа бор (совершенный вид)."],
["f02","f","say","Говори'ть / поговори'ть","Гаплашмоқ","Мы *говори'м* по-русски на уроке. Давай *поговори'м* после работы.","Дарсда русча гаплашамиз. Келинг, ишдан кейин гаплашиб оламиз.","говори'ть — умуман гапирмоқ. поговори'ть — бир оз гаплашиб олмоқ. Ким билан? — с + творительный падеж: с дру'гом."],
["f03","f","get","Покупа'ть / купи'ть","Сотиб олмоқ","Я всегда *покупа'ю* хлеб здесь. Вчера я *купи'л* новый телефон.","Нонни доим шу ердан сотиб оламан. Кеча янги телефон сотиб олдим.","Нимани? — винительный падеж: купи'ть хлеб, маши'ну. Ҳозирги замон: я покупа'ю, ты покупа'ешь."],
["f04","f","mind","Знать / узна'ть","Билмоқ / билиб олмоқ","Я *зна'ю* этого человека. Новость я *узна'л* от друга.","Мен бу одамни биламан. Янгиликни дўстимдан билиб олдим.","знать — биламан (ҳолат). узна'ть — янги нарсани билиб олмоқ (натижа). Кимдан? — от + родительный: от дру'га."],
["f05","f","mind","Ду'мать / поду'мать","Ўйламоқ","Я часто *ду'маю* о семье. Я *поду'маю* и отвечу завтра.","Мен оилам ҳақида тез-тез ўйлайман. Ўйлаб кўриб, эртага жавоб бераман.","Ким ёки нима ҳақида? — о + предложный падеж: о семье', о рабо'те."],
["f06","f","act","Де'лать / сде'лать","Қилмоқ","Сейчас я *де'лаю* домашнее задание. Вчера я *сде'лал* всё за час.","Ҳозир уй вазифасини қиляпман. Кеча ҳаммасини бир соатда қилиб бўлдим.","де'лать — қиляпман (жараён). сде'лать — қилиб бўлдим (натижа). Ўтган замон охири: -л (он), -ла (она), -ли (они)."],
["f07","f","say","Расска'зывать / рассказа'ть","Гапириб бермоқ","Бабушка часто *расска'зывает* сказки. *Расскажи'* мне о поездке!","Бувим тез-тез эртак айтиб беради. Менга сафаринг ҳақида гапириб бер!","Кимга? — дательный падеж: мне, ему'. Нима ҳақида? — о + предложный: о пое'здке."],
["f08","f","say","Сообща'ть / сообщи'ть","Хабар бермоқ","Банк *сообща'ет* клиентам о новых тарифах. *Сообщи'* мне, когда приедешь.","Банк мижозларга янги тарифлар ҳақида хабар беради. Келганингда менга хабар бер.","Расмийроқ сўз. Кимга? — дательный: клие'нтам, мне. Нима ҳақида? — о + предложный."],
["f09","f","learn","Слу'шать / послу'шать","Тингламоқ","Я *слу'шаю* музыку в машине. *Послу'шай* эту песню!","Машинада мусиқа тинглайман. Бу қўшиқни эшитиб кўр!","Нимани? — винительный: слу'шать му'зыку. слу'шать — диққат билан тингламоқ, слы'шать — шунчаки эшитмоқ."],
["f10","f","get","Храни'ть / сохрани'ть","Сақламоқ","Мы *храни'м* документы в сейфе. Не забудь *сохрани'ть* файл!","Ҳужжатларни сейфда сақлаймиз. Файлни сақлашни унутма!","храни'ть — узоқ вақт сақлаб турмоқ. сохрани'ть — бир марта сақлаб қўймоқ (компьютердаги «Сохрани'ть» тугмаси)."],
["f11","f","mind","Сожале'ть / пожале'ть","Афсусланмоқ","Я *сожале'ю*, что не пришёл. Ты *пожале'ешь* об этом!","Келмаганимга афсусдаман. Бунга ҳали афсусланасан!","Нима ҳақида? — о + предложный: об э'том. «Сожале'ю» — расмий «афсуски» маъносида ҳам ишлатилади."],
["f12","f","say","Звони'ть / позвони'ть","Қўнғироқ қилмоқ","Мама *звони'т* мне каждый день. Я *позвоню'* тебе вечером.","Ойим менга ҳар куни қўнғироқ қилади. Кечқурун сенга қўнғироқ қиламан.","Кимга? — дательный падеж: ма'ме, мне, тебе'. Урғу охирида: звони'т, позвоню'."],
["f13","f","say","Отвеча'ть / отве'тить","Жавоб бермоқ","Он всегда *отвеча'ет* быстро. *Отве'ть* на вопрос, пожалуйста.","У доим тез жавоб беради. Илтимос, саволга жавоб бер.","Нимага? — на + винительный: на вопро'с, на письмо'. Кимга? — дательный: учи'телю."],
["f14","f","learn","Дока'зывать / доказа'ть","Исботламоқ","Он долго *дока'зывал*, что прав. Ты можешь это *доказа'ть*?","У ҳақ эканини узоқ исботлашга уринди. Буни исботлай оласанми?","дока'зывать — исботлашга уринмоқ (жараён). доказа'ть — исботлаб бўлмоқ (натижа)."],
["f15","f","act","Удаля'ть / удали'ть","Ўчириб ташламоқ","Я *удаля'ю* старые фото. Я случайно *удали'л* важный файл.","Эски расмларни ўчиряпман. Тасодифан муҳим файлни ўчириб юбордим.","Телефон ва компьютерда кўп учрайди: «Удали'ть» — ўчириш тугмаси."],
["f16","f","get","Име'ть","Эга бўлмоқ","Каждый человек *име'ет* право на отдых.","Ҳар бир инсон дам олиш ҳуқуқига эга.","Кўпроқ расмий гапда ишлатилади. Оддий гапда «У меня' есть…» дейилади: У меня' есть маши'на."],
["f17","f","mind","Предпочита'ть","Афзал кўрмоқ","Я *предпочита'ю* чай, а не кофе.","Мен қаҳвадан кўра чойни афзал кўраман.","Нимани? — винительный падеж: предпочита'ю чай. Нимадан кўра? — «а не …»: чай, а не ко'фе."],
["f18","f","act","Испо'льзовать","Фойдаланмоқ","Я *испо'льзую* Excel на работе каждый день.","Ишда ҳар куни Excel дастуридан фойдаланаман.","Ўзбекчада «-дан», русчада эса винительный падеж: испо'льзовать компью'тер (предлогсиз)."],
["f19","f","act","Отправля'ть / отпра'вить","Жўнатмоқ","Я *отправля'ю* отчёт каждую пятницу. Я уже *отпра'вил* тебе письмо.","Ҳисоботни ҳар жума жўнатаман. Сенга хатни аллақачон жўнатдим.","Нимани? — винительный, кимга? — дательный: отпра'вить письмо' дру'гу."],
["f20","f","learn","Учи'ть / вы'учить","Ёд олмоқ","Я *учу'* новые слова каждый день. Я *вы'учил* стихотворение наизусть.","Ҳар куни янги сўзларни ёдлайман. Шеърни ёд олдим.","учи'ть слова' — ёдламоқ (жараён). вы'учить — ёдлаб бўлмоқ. Урғу «вы» да: вы'учить."],
["f21","f","time","Спеши'ть / поспеши'ть","Шошилмоқ","Извините, я *спешу'* на работу. *Поспеши'*, автобус уходит!","Кечирасиз, ишга шошиляпман. Шошил, автобус кетяпти!","Қаерга? — на/в + винительный: на рабо'ту, в шко'лу. Ҳозирги замон: я спешу', ты спеши'шь."],
["f22","f","get","Загружа'ть / загрузи'ть","Юклаб олмоқ","Я *загружа'ю* фото в облако. Я *загрузи'л* документ на сайт.","Расмларни булутга юкляпман. Ҳужжатни сайтга юкладим.","Компьютер ва интернетда ишлатилади: загрузи'ть файл на сайт. Интернетдан юклаб олишга кўпинча «скача'ть» дейилади."],
["f23","f","learn","Изуча'ть / изучи'ть","Ўрганмоқ","Я *изуча'ю* русский язык. Мы *изучи'ли* эту тему на уроке.","Мен рус тилини ўрганяпман. Бу мавзуни дарсда ўрганиб чиқдик.","изуча'ть — чуқур ўрганмоқ (тил, фан). учи'ть — ёдламоқ. научи'ть — бошқага ўргатмоқ."],
["f24","f","learn","Пока'зывать / показа'ть","Кўрсатмоқ","Гид *пока'зывает* туристам город. *Покажи'* мне свой паспорт.","Гид сайёҳларга шаҳарни кўрсатяпти. Менга паспортингни кўрсат.","Кимга? — дательный (мне, тури'стам). Нимани? — винительный (го'род, па'спорт)."],
["f25","f","learn","Переписа'ть","Кўчириб ёзмоқ","*Перепиши'* этот текст в тетрадь.","Бу матнни дафтарга кўчириб ёз.","пере- олд қўшимчаси «қайтадан» ёки «бошқа жойга» маъносини беради. Жуфти: перепи'сывать."],
["f26","f","say","Подска'зывать / подсказа'ть","Айтиб юбормоқ","На экзамене нельзя *подска'зывать*. *Подскажи'те*, где остановка?","Имтиҳонда айтиб юбориш мумкин эмас. Айтиб юборолмайсизми, бекат қаерда?","«Подскажи'те, пожа'луйста…» — кўчада йўл ёки бирор нарса сўрашда энг кўп ишлатиладиган хушмуомала ибора."],
["f28","f","learn","Опи'сывать / описа'ть","Тасвирламоқ","Автор красиво *опи'сывает* природу. *Опиши'* свою комнату.","Муаллиф табиатни чиройли тасвирлайди. Хонангни тасвирлаб бер.","Нимани? — винительный: описа'ть ко'мнату, челове'ка. Ҳозирги замон: я опи'сываю."],
["f29","f","act","Ре'зать / наре'зать","Кесмоқ","Мама *ре'жет* хлеб. *Наре'жь* помидоры для салата.","Ойим нон кесяпти. Салат учун помидорни тўғраб қўй.","Ҳозирги замонда «з» ўрнига «ж» келади: я ре'жу, ты ре'жешь. наре'зать — бўлакларга кесиб чиқмоқ."],
["f30","f","say","Сказа'ть","Айтмоқ","Он *сказа'л*, что придёт завтра.","У эртага келишини айтди.","Совершенный вид, жуфти — говори'ть. Кимга? — дательный: скажи' мне."],
["f31","f","mood","Пла'кать / попла'кать","Йиғламоқ","Ребёнок *пла'чет*, потому что устал.","Бола чарчагани учун йиғлаяпти.","Ҳозирги замонда «к» ўрнига «ч» келади: я пла'чу, он пла'чет. попла'кать — бир оз йиғлаб олмоқ."],
["f32","f","act","Доставля'ть / доста'вить","Етказиб бермоқ","Курьер *доставля'ет* заказы. Пиццу *доста'вили* за 30 минут.","Курьер буюртмаларни етказиб беради. Пиццани 30 дақиқада етказиб беришди.","Нимани? — винительный. Қаерга? — в/на + винительный: доста'вить зака'з домо'й, в о'фис."],
["f34","f","learn","Научи'ть","Ўргатмоқ","Папа *научи'л* меня плавать.","Дадам менга сузишни ўргатди.","Кимни? — винительный (меня', сы'на). Нимага? — феъл ёки дательный: научи'ть пла'вать, научи'ть ру'сскому языку'."],
["f35","f","get","Лови'ть / пойма'ть","Тутмоқ","Дети *ло'вят* мяч. Полиция *пойма'ла* вора.","Болалар тўпни тутяпти. Полиция ўғрини тутди.","лови'ть — тутишга уринмоқ (жараён). пойма'ть — тутиб олди (натижа). Ҳозирги замон: я ловлю', они' ло'вят."],
["f36","f","act","Гото'вить / пригото'вить","Тайёрламоқ","Мама *гото'вит* плов. Я *пригото'вил* ужин для семьи.","Ойим палов тайёрлаяпти. Оилам учун кечки овқат тайёрладим.","Овқат тайёрламоқ маъносида кўп ишлатилади. Имтиҳонга тайёрланмоқ — гото'виться к экза'мену (-ся билан)."],
["f37","f","say","Спроси'ть","Сўрамоқ (савол бериб)","Я *спроси'л* у учителя, что значит это слово.","Ўқитувчидан бу сўз нимани билдиришини сўрадим.","спроси'ть — савол бериб сўрамоқ: спроси'ть у кого'? попроси'ть — бирор нарсани илтимос қилмоқ. Жуфти: спра'шивать."],
["f38","f","mind","Замеча'ть / заме'тить","Пайқамоқ","Я не *заме'тил* ошибку в отчёте.","Ҳисоботдаги хатони пайқамадим.","Нимани? — винительный: заме'тить оши'бку, челове'ка."],
["f40","f","time","Уступи'ть","Жой бермоқ","Он *уступи'л* место пожилой женщине в автобусе.","У автобусда кекса аёлга жой берди.","Кимга? — дательный: уступи'ть ме'сто ба'бушке. «Ён бермоқ» маъноси ҳам бор: уступи'ть в спо'ре."],

const NEAR={freq:["dur"],dur:["freq","period"],moment:["relday","daypart"],daypart:["relday","moment"],relday:["period","daypart","moment"],period:["relday","dur","week"],week:["period","relday"],
  temp:["season","sky"],sky:["precip","wind","temp"],wind:["sky"],precip:["sky","season"],ask:["precip","temp"],season:["temp","precip"],nature:["sky","precip"],

/* pairs that can mean the same thing: never shown together, so a question never has two right answers */
const CONFLICT=[["t02","t35"],["t06","t29"],["t25","t44"],["t43","t47"],["w27","w54"],["f48","f80"],["f44","f80"],["f20","f23"],["f20","f34"]];

const ACC=s=>(s||"").replace(/'/g,"́");
const W=RAW.map(([id,tp,cl,ru,uz,ex,exUz,note])=>({id,tp,cl,ls:TOPIC_LESSON[tp],ru:ACC(ru),uz,ex:ACC(ex),exUz:exUz||"",note:ACC(note)}));
const BY={};W.forEach(w=>{BY[w.id]=w;});
const CF={};CONFLICT.forEach(([a,b])=>{(CF[a]||(CF[a]=new Set())).add(b);(CF[b]||(CF[b]=new Set())).add(a);});
function norm(s){return s.toLowerCase().replace(/́/g,"").replace(/ё/g,"е").replace(/[^\p{L}\p{N}]+/gu," ").trim();}
function grams(n){const t=" "+n+" ",g=new Set();for(let i=0;i<t.length-2;i++)g.add(t.slice(i,i+3));return g;}
W.forEach(w=>{["ru","uz"].forEach(s=>{const n=norm(w[s]);w["n"+s]=n;w["w"+s]=n.split(" ").filter(x=>x.length>1);w["g"+s]=grams(n);});});
function dice(A,B){let n=0;A.forEach(x=>{if(B.has(x))n++;});return A.size+B.size?2*n/(A.size+B.size):0;}
function wsim(A,B){if(!A.length||!B.length)return 0;const p=x=>x.slice(0,4),Bp=B.map(p);let m=0;A.forEach(x=>{if(Bp.includes(p(x)))m++;});return m/Math.max(A.length,B.length);}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function lessonWords(l){return W.filter(w=>w.ls===l);}
function poolFor(cfg){return W.filter(w=>w.ls===cfg.lesson&&(cfg.topic==="all"||w.tp===cfg.topic));}
/* closeness of a wrong answer c to the right answer t, measured on the language shown in the options */
function score(t,c,side){
  const o=side==="ru"?"uz":"ru";let s=0;
  if(c.cl===t.cl)s+=3;else if((NEAR[t.cl]||[]).includes(c.cl))s+=1.2;
  if(c.tp===t.tp)s+=.4;
  s+=2.2*wsim(t["w"+side],c["w"+side])+2*dice(t["g"+side],c["g"+side])+.6*dice(t["g"+o],c["g"+o]);
  const la=t["n"+side].length,lb=c["n"+side].length;s+=.6*(1-Math.abs(la-lb)/Math.max(la,lb,1));
  return s+Math.random()*1.2;
}
function pickOpts(t,side,pool){
  const bad=CF[t.id]||new Set();
  const ranked=pool.filter(c=>c.id!==t.id&&!bad.has(c.id)).map(c=>({c,s:score(t,c,side)})).sort((a,b)=>b.s-a.s);
  const out=[],seen=new Set([t["n"+side]]);
  for(const {c} of ranked){if(seen.has(c["n"+side]))continue;seen.add(c["n"+side]);out.push(c.id);if(out.length===3)break;}
  return shuffle([t.id,...out]);
}
function buildQs(cfg,ids){
  const pool=poolFor(cfg);
  let list=ids?shuffle(ids.map(id=>BY[id])):shuffle(pool.slice());
  if(!ids&&cfg.count!=="all")list=list.slice(0,+cfg.count);
  return list.map(w=>makeQ(w,pool));
}
/* every question: Uzbek prompt, four Russian answers */
function makeQ(w,pool){return {id:w.id,dir:"uz",opts:pickOpts(w,"ru",pool)};}

function say(text){

}
function sayBtn(t){return TTS?`<button type="button" class="say" data-say="${esc(t)}" aria-label="Тинглаш" title="Тинглаш">${SPK}</button>`:"";}
function chip(g,v,label){return `<button type="button" class="chip" data-set="${g}" data-val="${v}" aria-pressed="${String(pend[g])===v}">${label}</button>`;}

/* ---- home: lesson picker ---- */
function lessonStatus(l){
  const s=loadState(l.id);
  if(!s)return {text:"Ҳали бошланмаган",go:"Бошлаш"};
  const tot=s.qs.length,done=s.ans.length,ok=s.ans.filter(a=>a.ok).length;
  if(s.phase==="end")return {text:`Охирги натижа: ${ok} / ${tot} тўғри (${Math.round(ok*100/tot)}%)`,go:"Натижани кўриш"};
  if(!done)return {text:`${tot} та саволлик квиз бошланган`,go:"Давом эттириш"};
  return {text:`${done} / ${tot} та саволга жавоб берилган · ✓ ${ok} · ✗ ${done-ok}`,go:"Давом эттириш"};
}
function renderHome(){
  topEl.innerHTML=`<div class="kicker">Рус тили · сўз бойлиги</div><h1>Дарслар</h1><p>Керакли дарсни танланг. Ҳар бир дарсдаги натижангиз алоҳида сақланади.</p>`;
  home.innerHTML=`<ol class="lessons">${LESSONS.map(l=>{
    const n=lessonWords(l.id).length,st=lessonStatus(l),tk=Object.keys(l.topics);
    const parts=tk.length>1?" · "+tk.map(t=>`${l.topics[t]} ${W.filter(w=>w.tp===t).length}`).join(", "):"";
    return `<li><a class="lesson-card" href="#dars-${l.id}"><div class="pad"><article class="page">${BIND}
      <div class="head"><div class="num">${l.no}</div><div class="meta"><span class="topic">Дарс</span><span class="of">${l.pages}</span></div></div>
      <div class="body"><h2 class="ltitle">${l.title}</h2><div class="lsub">${n} та ${l.unit}${parts}</div><div class="status">${st.text}</div><span class="go">${st.go} →</span></div>
    </article></div></a></li>`;}).join("")}</ol>`;
}

/* ---- lesson ---- */
function renderTop(){
  const l=LES[L],n=lessonWords(L).length;
  topEl.innerHTML=`<a class="crumb" href="#">← Барча дарслар</a><div class="kicker">${l.no}-дарс</div><h1>${l.title}</h1><p>Дафтардаги ${l.pages}: ${n} та ${l.unit}, урғулари белгиланган.${l.extra||""} Савол ўзбекча, жавоблар русча.</p><p class="kbd">Клавиатурада: 1–4 — жавоб, Enter — кейинги савол, ← — олдинги савол.</p>`;
}
function renderSettings(){
  const l=LES[L],tk=Object.keys(l.topics),n=t=>poolFor({lesson:L,topic:t}).length;
  setbody.innerHTML=
  (tk.length>1?`<div class="group"><span class="lbl" id="l-topic">Мавзу</span><div class="chips" role="group" aria-labelledby="l-topic">${chip("topic","all","Ҳаммаси · "+n("all"))}${tk.map(t=>chip("topic",t,l.topics[t]+" · "+n(t))).join("")}</div></div>`:"")+
  `<div class="group"><span class="lbl" id="l-count">Саволлар сони</span><div class="chips" role="group" aria-labelledby="l-count">${chip("count","20","20 та")}${chip("count","40","40 та")}${chip("count","all","Ҳаммаси")}</div></div>
   <div><button type="button" class="btn" data-act="start">Янги квизни бошлаш</button></div>`;
  const c=S.cfg,label=S.retry?"Хатолар":(c.topic==="all"?"Ҳаммаси":TOPICS[c.topic]);
  sum.innerHTML=`<span>Созламалар</span><span class="cur">${label} · ${S.qs.length} савол</span>`;
}
function renderProg(){
  const tot=S.qs.length,done=S.ans.length,ok=S.ans.filter(a=>a.ok).length;
  prog.innerHTML=`<span class="pos">${Math.min((view!==null?view:S.i)+1,tot)} / ${tot}</span><span class="bar"><i style="width:${(done/tot*100).toFixed(1)}%"></i></span><span class="tally"><b class="ok" title="Тўғри">✓ ${ok}</b><b class="no" title="Хато">✗ ${done-ok}</b></span>`;
}
function qHTML(idx,review){
  const q=S.qs[idx],w=BY[q.id],ps=q.dir,os=ps==="ru"?"uz":"ru";
  const a=review?S.ans[idx]:(S.phase==="fb"?S.ans[S.ans.length-1]:null);
  const opts=q.opts.map((id,k)=>{
    let c="opt "+os,m="";
    if(a){if(id===q.id){c+=" right";m="✓";}else if(id===a.pick){c+=" wrong";m="✗";}else c+=" dim";}
    return `<li><button type="button" class="${c}" data-ans="${k}"${a?" disabled":""}><span class="k">${k+1}</span><span class="t" lang="${os}">${esc(BY[id][os])}</span><span class="mark" aria-hidden="true">${m}</span></button></li>`;
  }).join("");
  let fb="";
  if(a){
    const v=review?(a.ok?"Бу саволга тўғри жавоб бергансиз":"Бу саволда хато қилгансиз"):(a.ok?"Тўғри!":"Хато");
    fb=`<div class="fb" role="status">
      <div class="verdict ${a.ok?"ok":"no"}${review?" small":""}">${v}</div>
      <div class="pair"><span class="ru" lang="ru">${esc(w.ru)}</span> — ${esc(w.uz)}${ps==="uz"?sayBtn(w.ru):""}</div>
      ${w.exUz?`<div class="example"><div class="lbl">Мисол</div><p class="ex-ru" lang="ru">${exHTML(w.ex)}${sayBtn(w.ex)}</p><p class="ex-uz">${esc(w.exUz)}</p></div>`
        :(w.ex?`<div class="ex">Мисол: <i lang="ru">${esc(w.ex)}</i></div>`:"")}
      ${w.note?`<div class="explain"><div class="lbl">Изоҳ</div><p>${esc(w.note)}</p></div>`:""}
    </div>`;
  }
  const back=idx>0?`<button type="button" class="btn ghost" data-act="back">← Олдинги</button>`:"";
  let fwd="";
  if(review)fwd=`<button type="button" class="btn" data-act="fwd">Кейинги →</button>`;
  else if(a)fwd=`<button type="button" class="btn next" data-act="next">${S.i===S.qs.length-1?"Натижани кўриш":"Кейинги"} →</button>`;
  const far=review&&(S.phase==="end"||S.i-idx>1)?`<button type="button" class="linkbtn" data-act="live">${S.phase==="end"?"Натижага қайтиш":"Жорий саволга қайтиш"}</button>`:"";
  const nav=(back||fwd)?`<div class="nav">${back}<span class="sp"></span>${fwd}</div>${far}`:"";
  return `<div class="head"><div class="num">${idx+1}</div><div class="meta"><span class="topic">${review?"Кўриб чиқиш":(S.retry?"Хатолар устида":TOPICS[w.tp])}</span><span class="of">${S.qs.length} та саволдан</span></div></div>
  <div class="body">
    <div class="ask">${ps==="ru"?"Ўзбекча таржимасини топинг":"Русчасини топинг"}</div>
    <div class="prompt"><h2 class="word ${ps}" lang="${ps}">${esc(w[ps])}</h2>${ps==="ru"?sayBtn(w.ru):""}</div>
    ${ps==="uz"&&w.exUz?`<p class="ctx">Гапда: ${esc(w.exUz)}</p>`:""}
    <ol class="opts">${opts}</ol>${fb}${nav}
  </div>`;
}
function wrongIds(){return [...new Set(S.ans.filter(a=>!a.ok).map(a=>a.id))];}
function endHTML(){
  const tot=S.qs.length,ok=S.ans.filter(a=>a.ok).length,pct=Math.round(ok*100/tot),wr=wrongIds();
  const msg=pct===100?"Ҳаммасига тўғри жавоб бердингиз. Аъло!":pct>=85?"Жуда яхши. Хато қилинган бир нечта сўзни такрорлаб олинг.":pct>=60?"Ёмон эмас. Хато қилинган сўзларни яна бир бор ишлаб чиқинг.":"Сўзларни рўйхатдан яна бир бор кўриб чиқинг ва хатолар устида ишланг.";
  const rows=wr.map(id=>`<tr><td class="ru" lang="ru">${esc(BY[id].ru)}</td><td>${esc(BY[id].uz)}</td></tr>`).join("");
  return `<div class="head"><div class="num">${ok}</div><div class="meta"><span class="topic">Натижа</span><span class="of">${tot} тадан тўғри · ${pct}%</span></div></div>
  <div class="body">
    <p class="msg">${msg}</p>
    ${wr.length?`<h3 class="sub">Хато қилинган сўзлар · ${wr.length}</h3><div class="tblwrap"><table class="book"><thead><tr><th>Сўз</th><th>Таржима</th></tr></thead><tbody>${rows}</tbody></table></div>`:""}
    <div class="actions">${wr.length?`<button type="button" class="btn" data-act="retry">Хатоларни қайта ишлаш (${wr.length})</button>`:""}<button type="button" class="btn${wr.length?" ghost":""}" data-act="again">Янги квиз</button><button type="button" class="btn ghost" data-act="back">← Саволларни кўриш</button><a class="btn ghost" href="#">Барча дарслар</a></div>
  </div>`;
}
function renderPage(anim){
  const review=view!==null;
  const inner=(!review&&S.phase==="end")?endHTML():qHTML(review?view:S.i,review);
  pad.innerHTML=`<article class="page${review?" review":""}${anim&&!RM.matches?" enter":""}">${BIND}${inner}</article>`;
}
function renderAll(anim){renderSettings();renderProg();renderPage(anim);}
function renderList(){
  const l=LES[L];
  const sec=t=>{const ws=W.filter(w=>w.tp===t);return `<h3 class="sub">${l.topics[t]} · ${ws.length}</h3><div class="tblwrap"><table class="book"><thead><tr><th>Сўз</th><th>Таржима</th></tr></thead><tbody>${ws.map(w=>`<tr><td class="ru" lang="ru">${esc(w.ru)}</td><td>${esc(w.uz)}${w.exUz?`<div class="lex" lang="ru">${exHTML(w.ex)}</div><div class="lex-uz">${esc(w.exUz)}</div>`:""}</td></tr>`).join("")}</tbody></table></div>`;};
  $("listbody").innerHTML=Object.keys(l.topics).map(sec).join("")+(l.note?`<p class="note">${l.note}</p>`:"");
  $("listcount").textContent=lessonWords(L).length+" та";
}
function topIntoView(){const p=pad.querySelector(".page");if(p&&p.getBoundingClientRect().top<0)p.scrollIntoView({block:"start"});}
function newQuiz(cfg,ids){
  busy=false;view=null;
  S={cfg:{...cfg,lesson:L},qs:buildQs({...cfg,lesson:L},ids),i:0,ans:[],phase:"q",retry:!!ids};
  pend={...S.cfg};save();renderAll(true);topIntoView();
}
function answer(k){
  if(!S||S.phase!=="q"||busy||view!==null)return;
  const q=S.qs[S.i],pick=q.opts[k];if(pick===undefined)return;
  S.ans.push({id:q.id,pick,ok:pick===q.id});S.phase="fb";save();renderProg();renderPage(false);
  /* no auto-advance: the learner reads the feedback and taps "Кейинги" */
  const n=pad.querySelector(".next");if(n)n.focus({preventScroll:true});
  const nv=pad.querySelector(".nav");if(nv&&nv.getBoundingClientRect().bottom>window.innerHeight)nv.scrollIntoView({block:"nearest",behavior:RM.matches?"auto":"smooth"});
}
function tear(done){
  const p=pad.querySelector(".page");
  if(!p||RM.matches){done();return;}
  let fired=false;const go=()=>{if(fired)return;fired=true;done();};
  p.classList.remove("enter");p.classList.add("tear");
  p.addEventListener("animationend",go,{once:true});setTimeout(go,420);
}
function next(){
  if(!S||S.phase!=="fb"||busy||view!==null)return;
  busy=true;
  tear(()=>{S.i++;S.phase=S.i>=S.qs.length?"end":"q";busy=false;save();renderProg();renderPage(true);topIntoView();});
}
function back(){
  if(!S||busy)return;
  const cur=view!==null?view:(S.phase==="end"?S.qs.length:S.i);
  if(cur<1)return;
  view=cur-1;renderProg();renderPage(true);topIntoView();
}
function fwd(){
  if(!S||view===null)return;
  view++;
  if(view>=S.ans.length||(S.phase!=="end"&&view>=S.i))view=null;
  renderProg();renderPage(true);topIntoView();
}
function live(){view=null;renderProg();renderPage(true);topIntoView();}

/* ---- routing: #dars-1, #dars-2, or the lesson list ---- */
function lessonFromHash(){const m=/^#dars-(\d+)$/.exec(location.hash||"");return m&&LES[m[1]]?m[1]:null;}
function route(){
  busy=false;view=null;
  L=lessonFromHash();
  if(!L){S=null;lessonSec.hidden=true;home.hidden=false;renderHome();}
  else{
    home.hidden=true;lessonSec.hidden=false;settings.open=false;renderTop();renderList();
    const s=loadState(L);
    if(s){S=s;pend={...S.cfg};renderAll(false);}else newQuiz(DEF(L));
  }
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);

document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.ans!==undefined){answer(+b.dataset.ans);return;}
  if(b.dataset.say!==undefined){say(b.dataset.say);return;}
  if(b.dataset.set){pend[b.dataset.set]=b.dataset.val;renderSettings();return;}
  const act=b.dataset.act;
  if(act==="next")next();
  else if(act==="back")back();
  else if(act==="fwd")fwd();
  else if(act==="live")live();
  else if(act==="start"){settings.open=false;newQuiz(pend);}
  else if(act==="retry")newQuiz(S.cfg,wrongIds());
  else if(act==="again")newQuiz(S.cfg);
});
document.addEventListener("keydown",e=>{
  if(!L||!S||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.target.closest&&e.target.closest("input,textarea"))return;
  if(e.key==="ArrowLeft"){e.preventDefault();back();return;}
  if(view!==null){if(e.key==="ArrowRight"){e.preventDefault();fwd();}return;}
  if(S.phase==="q"&&/^[1-4]$/.test(e.key)){e.preventDefault();answer(+e.key-1);return;}
  if(S.phase==="fb"&&(e.key==="Enter"||e.key==="ArrowRight")){
    if(e.target.closest&&e.target.closest("button,summary,a"))return;
    e.preventDefault();next();
  }
});
function start(data){
  if(data&&data.L&&valid(data.S,data.L)){MEM[data.L]=data.S;if(!lessonFromHash())location.hash="dars-"+data.L;}
  route();
}
window.claude?.hot?.snapshot(()=>({L,S}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
</body>
</html>
