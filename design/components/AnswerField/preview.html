<!doctype html>
<html lang="uz">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>AnswerField</title></head>
<body>
<div class="rt-stage">
  <div class="rt-field">
    <label class="rt-label" for="a1">Жавобингиз</label>
    <input class="rt-input" id="a1" type="text" lang="ru" placeholder="Русча ёзинг" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="done">
  </div>
  <div class="rt-field">
    <label class="rt-label" for="a2">Жавобингиз</label>
    <input class="rt-input" id="a2" type="text" lang="ru" value="Moskve" aria-invalid="true" aria-describedby="w2" autocomplete="off" spellcheck="false">
    <p class="rt-warn" id="w2" role="alert"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.6v5.2" stroke-width="2.2"/><path d="M12 16.3v.2" stroke-width="2.6"/></g></svg><span>Жавобда лотин ҳарфлари бор. Клавиатурани рус тилига ўтказиб, рус ҳарфларида ёзинг.</span></p>
  </div>
  <div class="rt-field">
    <label class="rt-label" for="a3">Жавобингиз</label>
    <input class="rt-input" id="a3" type="text" lang="ru" placeholder="Русча ёзинг" aria-invalid="true" aria-describedby="w3" autocomplete="off" spellcheck="false">
    <p class="rt-warn" id="w3" role="alert"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.6v5.2" stroke-width="2.2"/><path d="M12 16.3v.2" stroke-width="2.6"/></g></svg><span>Жавоб бўш. Жавобни ёзинг ёки «Билмайман» тугмасини босинг.</span></p>
  </div>
  <button class="rt-btn rt-btn--primary rt-btn--block" type="button">Текшириш</button>
</div>
</body>
</html>
