<!doctype html>
<html lang="uz">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>OptionList</title></head>
<body>
<div class="rt-stage">
  <p class="rt-label">Русчасини топинг</p>
  <h3 class="rt-prompt-uz">Қўнғироқ қилмоқ</h3>
  <p class="rt-prompt-ctx">Гапда: Ойим менга ҳар куни қўнғироқ қилади.</p>
  <ol class="rt-options">
    <li><button class="rt-option is-dim" type="button" disabled><span class="rt-option__key">1</span><span class="rt-option__text" lang="ru">Отвеча́ть / отве́тить</span><span class="rt-option__mark"></span></button></li>
    <li><button class="rt-option is-wrong" type="button" disabled><span class="rt-option__key">2</span><span class="rt-option__text" lang="ru">Сообща́ть / сообщи́ть</span><span class="rt-option__mark"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></g></svg><span class="rt-sr">хато</span></span></button></li>
    <li><button class="rt-option is-correct" type="button" disabled><span class="rt-option__key">3</span><span class="rt-option__text" lang="ru">Звони́ть / позвони́ть</span><span class="rt-option__mark"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></g></svg><span class="rt-sr">тўғри</span></span></button></li>
    <li><button class="rt-option is-dim" type="button" disabled><span class="rt-option__key">4</span><span class="rt-option__text" lang="ru">Расска́зывать / рассказа́ть</span><span class="rt-option__mark"></span></button></li>
  </ol>
  <p class="rt-label" style="margin-top:8px">Тестда: танланган, баҳоланмаган</p>
  <ol class="rt-options">
    <li><button class="rt-option" type="button"><span class="rt-option__key">1</span><span class="rt-option__text" lang="ru">к</span><span class="rt-option__mark"></span></button></li>
    <li><button class="rt-option is-selected" type="button" aria-pressed="true"><span class="rt-option__key">2</span><span class="rt-option__text" lang="ru">по</span><span class="rt-option__mark"></span></button></li>
  </ol>
</div>
</body>
</html>
