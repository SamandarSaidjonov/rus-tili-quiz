<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IconButton</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<style>
  .rt-pagehead { display: flex; align-items: center; gap: var(--space-2); }
  .rt-pagehead h1 { margin: 0; min-width: 0; font: 700 34px/38px var(--font-display); }
  .rt-pagehead__end { margin-left: auto; display: flex; align-items: center; gap: var(--space-1); }
</style>
</head>
<body>
<div class="rt-stage">
  <div class="rt-pagehead">
    <h1>Рус тили</h1>
    <div class="rt-pagehead__end">
      <button class="rt-iconbtn" type="button" aria-label="Темани алмаштириш" title="Темани алмаштириш">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false" class="rt-theme__sun"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.8v3M12 18.2v3M21.2 12h-3M5.8 12h-3M18.5 5.5l-2.1 2.1M7.6 16.4l-2.1 2.1M18.5 18.5l-2.1-2.1M7.6 7.6L5.5 5.5"/></g></svg>
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false" class="rt-theme__moon"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.4 14.1A8.7 8.7 0 0 1 9.9 3.6 8.7 8.7 0 1 0 20.4 14.1z"/></g></svg>
      </button>
      <button class="rt-iconbtn rt-iconbtn--danger" type="button" aria-label="Барча прогрессни тозалаш" title="Барча прогрессни тозалаш">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 6.5h15"/><path d="M9.6 6.5V4.9a1.4 1.4 0 0 1 1.4-1.4h2a1.4 1.4 0 0 1 1.4 1.4v1.6"/><path d="M6.6 6.5l.8 12.1a1.8 1.8 0 0 0 1.8 1.7h5.6a1.8 1.8 0 0 0 1.8-1.7l.8-12.1"/><path d="M10.3 10.3v6.2M13.7 10.3v6.2"/></g></svg>
      </button>
    </div>
  </div>
  <p class="rt-muted">Тугмалар бош саҳифа сарлавҳасининг ўнг четида туради. Тема тугмасида қоронғи темада қуёш, ёруғ темада ой кўринади.</p>
</div>
</body>
</html>
