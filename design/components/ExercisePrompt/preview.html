<!doctype html>
<html lang="uz">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>ExercisePrompt</title></head>
<body>
<div class="rt-stage">
  <div class="rt-exercise">
    <p class="rt-label">Қўшимчани ёзинг</p>
    <p class="rt-sentence" lang="ru">Я живу́ в Ташке́нт<span class="rt-gap" role="img" aria-label="бўш жой"></span>.</p>
  </div>
  <div class="rt-exercise">
    <p class="rt-label">Қавсдаги сўзни керакли шаклда ёзинг</p>
    <p class="rt-sentence" lang="ru">Я горжу́сь <span class="rt-bracket">(сын)</span>.</p>
  </div>
  <div class="rt-exercise">
    <p class="rt-label">Белгиланган сўз қайси падежда?</p>
    <p class="rt-sentence" lang="ru">Я пишу́ <span class="rt-target">ру́чкой</span>.</p>
  </div>
  <div class="rt-exercise">
    <p class="rt-label">Русчага таржима қилинг</p>
    <p class="rt-prompt-uz">Мен онамга қўнғироқ қиламан.</p>
    <div class="rt-hints"><p class="rt-label">Сўзлар</p><ul>
      <li>мен — <span lang="ru">я</span></li><li>қўнғироқ қиламан — <span lang="ru">звоню́</span></li><li>она — <span lang="ru">ма́ма</span></li>
    </ul></div>
  </div>
</div>
</body>
</html>
