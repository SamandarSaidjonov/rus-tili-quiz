<!doctype html>
<html lang="uz">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>ExerciseScreen</title></head>
<body>
<div style="padding:16px">
<div class="rt-phone">
  <header class="rt-topbar">
    <div class="rt-topbar__row">
      <a class="rt-back" href="#" aria-label="Машқлар рўйхатига қайтиш"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5.5M11 6l-6 6 6 6"/></g></svg></a>
      <div style="min-width:0"><p class="rt-topbar__title">Предложный падеж</p><p class="rt-topbar__sub">Қавсдаги сўз · 10 та машқ</p></div>
    </div>
    <div class="rt-progress">
  <span class="rt-progress__pos">4 / 10</span>
  <span class="rt-bar" role="progressbar" aria-valuemin="0" aria-valuemax="10" aria-valuenow="4" aria-label="4 та саволга жавоб берилган"><i style="width:40.0%"></i></span>
  <span class="rt-tally"><span class="rt-tally__ok"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></g></svg><span class="rt-sr">Тўғри:</span>2</span><span class="rt-tally__no"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></g></svg><span class="rt-sr">Хато:</span>2</span></span>
</div>
  </header>
  <div class="rt-phone__body">
    <article class="rt-card">
      <div class="rt-exercise">
        <p class="rt-label">Қавсдаги сўзни керакли шаклда ёзинг</p>
        <p class="rt-sentence" lang="ru">Я ду́маю о <span class="rt-bracket">(сестра́)</span>.</p>
      </div>
      <div class="rt-field">
        <label class="rt-label" for="s1">Жавобингиз</label>
        <input class="rt-input" id="s1" type="text" lang="ru" value="сестру" readonly>
      </div>
    </article>
    <section class="rt-feedback is-wrong" role="status">
      <p class="rt-verdict"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></g></svg>Хато</p>
      <div class="rt-right"><p class="rt-label">Тўғри жавоб</p><p class="rt-answer" lang="ru"><span>Я ду́маю о <mark>сестре́</mark>.</span><button class="rt-say rt-say--sm" type="button" aria-label="Тинглаш" title="Тинглаш"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false"><path d="M4 9.5h3.5L12.5 5v14l-5-4.5H4z" fill="currentColor"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.8 7.8 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button></p></div>
      <p class="rt-explain"><b>о + предложный падеж</b> (… ҳақида): <span lang="ru">сестра́ → сестре́</span>, -а ўрнига -е.</p>
    </section>
  </div>
  <div class="rt-actionbar"><div class="rt-actions">
    <button class="rt-btn rt-btn--secondary" type="button">← Олдинги</button>
    <button class="rt-btn rt-btn--primary" type="button">Кейинги →</button>
  </div></div>
  <nav class="rt-nav" aria-label="Бўлимлар">
  <a class="rt-nav__item" href="#"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5C10 5 7.5 4.5 4 5v13.5c3.5-.5 6 0 8 1.5 2-1.5 4.5-2 8-1.5V5c-3.5-.5-6 0-8 1.5z"/><path d="M12 6.5V20"/></g></svg><span>Мавзулар</span></a>
  <a class="rt-nav__item" href="#" aria-current="page"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 19.5l1-4.5L15.8 4.7a1.8 1.8 0 0 1 2.5 0l1 1a1.8 1.8 0 0 1 0 2.5L9 18.5z"/><path d="M13.8 6.7l3.5 3.5"/></g></svg><span>Машқлар</span></a>
  <a class="rt-nav__item" href="#"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="7" width="12.5" height="13.5" rx="2"/><path d="M8 3.5h10.5a2 2 0 0 1 2 2V16"/><path d="M7 16.5l2.7-6.5 2.7 6.5M8 14.3h3.4"/></g></svg><span>Луғатлар</span></a>
  <a class="rt-nav__item" href="#"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 6.5h9.5M10.5 12h9.5M10.5 17.5h9.5"/><path d="M3.8 6.6l1.5 1.5 2.6-3M3.8 12.1l1.5 1.5 2.6-3M3.8 17.6l1.5 1.5 2.6-3"/></g></svg><span>Тестлар</span></a>
</nav>
</div>
</div>
</body>
</html>
